# Fly.io (Singapore). Deployed by .github/workflows/deploy.yml after CI passes on main, or by hand
# from the repo root: fly deploy. Secrets (docs/go-live-checklist.md):
#   fly secrets set DATABASE_URL=... REDIS_URL=... JWT_SECRET=... ENCRYPTION_KEY=... \
#     RESEND_API_KEY=... NOTIFYLK_USER_ID=... NOTIFYLK_API_KEY=... NOTIFYLK_SENDER_ID=... \
#     WHATSAPP_TOKEN=... WHATSAPP_PHONE_NUMBER_ID=... WHATSAPP_APP_SECRET=... WHATSAPP_VERIFY_TOKEN=... \
#     WHATSAPP_BUSINESS_ACCOUNT_ID=... ANTHROPIC_API_KEY=... R2_ACCOUNT_ID=... R2_ACCESS_KEY_ID=... \
#     R2_SECRET_ACCESS_KEY=... R2_PUBLIC_URL=... REVALIDATE_SECRET=... SENTRY_DSN=... OPS_EMAIL=...
app = "staydirect-api"
primary_region = "sin"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  ROOT_DOMAIN = "staydirect.lk"
  PUBLIC_API_URL = "https://api.staydirect.lk"
  OWNER_APP_URL = "https://app.staydirect.lk"
  PAYHERE_SANDBOX = "false"
  PAYPAL_SANDBOX = "false"
  SMS_PROVIDER = "notifylk"
  WEB_REVALIDATE_URL = "https://staydirect.lk/api/revalidate"
  SENTRY_ENVIRONMENT = "production"

[deploy]
  release_command = "node dist/scripts/migrate.js"

[processes]
  app = "node --enable-source-maps dist/src/main.js"
  worker = "node --enable-source-maps dist/src/worker.js"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
